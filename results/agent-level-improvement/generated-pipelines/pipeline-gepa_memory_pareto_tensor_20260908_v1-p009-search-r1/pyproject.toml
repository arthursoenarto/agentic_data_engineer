[project]
name = "pipeline-gepa-memory-pareto-tensor-20260908-v1-p009-search-r1"
version = "0.1.0"
description = "Deterministic ERA5 pressure-level fixture-to-Zarr v3 adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "xarray>=2025.1,<2027",
  "zarr>=3.0,<4",
  "numcodecs>=0.15,<0.17",
  "pandas>=2.2,<3",
  "netCDF4>=1.7,<2",
  "h5netcdf>=1.4,<2",
  "cfgrib>=0.9.14,<0.10",
  "eccodes>=2.40,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9"
]
