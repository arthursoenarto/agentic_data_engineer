[project]
name = "pipeline-gepa-memory-pareto-tensor-20260908-v1-p001-search-r1"
version = "0.1.0"
description = "Standalone ERA5 pressure-level fixture-to-Zarr family adapter"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1,<3",
  "xarray>=2025.6,<2027.0",
  "zarr>=3.0.8,<4",
  "numcodecs>=0.15,<0.17",
  "dask>=2025.5,<2027.0",
  "h5netcdf>=1.5,<2",
  "netCDF4>=1.7,<2",
  "cfgrib>=0.9.14,<0.10",
  "eccodes>=2.39,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
