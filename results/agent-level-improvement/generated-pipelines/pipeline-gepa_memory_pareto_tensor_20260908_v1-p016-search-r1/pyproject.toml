[project]
name = "pipeline-gepa-memory-pareto-tensor-20260908-v1-p016-search-r1"
version = "0.1.0"
description = "Offline ERA5 pressure-level fixture adapter publishing consolidated Zarr v3 for tensor-loading workloads."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "xarray>=2025.1,<2027",
  "zarr>=3.0,<4",
  "numcodecs>=0.15,<0.17",
  "h5netcdf>=1.4,<2",
  "netCDF4>=1.7,<2",
  "cfgrib>=0.9.15,<0.10",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
