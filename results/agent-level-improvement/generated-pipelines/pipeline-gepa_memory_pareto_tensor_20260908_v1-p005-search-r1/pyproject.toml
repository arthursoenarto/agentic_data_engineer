[project]
name = "pipeline-gepa-memory-pareto-tensor-20260908-v1-p005-search-r1"
version = "0.1.0"
description = "Deterministic fixture-first ERA5 pressure-level regular-grid adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "xarray>=2025.6,<2027",
  "zarr>=3.1,<4",
  "numcodecs>=0.15,<0.17",
  "h5netcdf>=1.4,<2",
  "netCDF4>=1.7,<2",
  "scipy>=1.14,<2",
  "cfgrib>=0.9.14,<0.10",
  "eccodes>=1.7,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
