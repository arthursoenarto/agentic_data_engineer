[project]
name = "pipeline-gepa-memory-pareto-tensor-20260908-v1-p004-search-r1"
version = "0.1.0"
description = "Standalone ERA5 pressure-level dataset-family adapter publishing consolidated Zarr v3."
requires-python = ">=3.13,<3.14"
dependencies = [
  "xarray>=2025.1,<2027.0",
  "zarr>=3.0,<4.0",
  "numcodecs>=0.15,<0.17",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "h5netcdf>=1.4,<2.0",
  "netCDF4>=1.7,<2.0",
  "cfgrib>=0.9.14,<0.10",
  "eccodes>=2.40,<3.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
