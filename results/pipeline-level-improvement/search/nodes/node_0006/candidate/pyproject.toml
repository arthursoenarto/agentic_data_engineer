[project]
name = "pipeline-era5-pareto-baseline-r1-20260907"
version = "1.0.0"
description = "Standalone ERA5 pressure-level dataset-family adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "xarray>=2025.1,<2027",
  "zarr>=3.0,<4",
  "h5netcdf>=1.4,<2",
  "netCDF4>=1.7,<2",
  "cfgrib>=0.9.14,<0.10"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9"
]
